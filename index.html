<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skullgirls Mobile · 技能树伤害加点优化器</title>
<style>
  :root{
    --bg:#0d1022; --card:#151a30; --card2:#1b2140; --line:#2a3157;
    --tx:#e8ebf5; --tx2:#9aa3c0; --tx3:#6b7494;
    --pierce:#4fc3f7; --crate:#ff8a80; --cdmg:#b388ff; --atk:#ffb74d;
    --good:#69d98c; --warn:#ffd166;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    line-height:1.55;}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  header h1{font-size:26px;margin:0 0 6px;letter-spacing:.5px}
  header p{margin:0;color:var(--tx2);font-size:14px}
  .headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .langbtns{display:flex;gap:6px;margin-top:4px}
  .langbtns button{background:var(--card2);color:var(--tx2);border:1px solid var(--line);
    border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}
  .langbtns button.active{background:var(--atk);color:#1c1405;font-weight:700;border-color:var(--atk)}
  .formula{margin:18px 0 6px;background:linear-gradient(135deg,#182042,#141a35);
    border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15px}
  .formula b{color:#fff}
  .formula .f{font-family:Consolas,monospace;color:var(--warn);font-size:15.5px}
  .formula small{display:block;color:var(--tx3);margin-top:6px}
  h2{font-size:19px;margin:44px 0 14px;border-left:4px solid var(--atk);padding-left:10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .card h3{margin:0 0 2px;font-size:17px}
  .card .sub{color:var(--tx3);font-size:12.5px;margin-bottom:12px}
  .statrow{display:flex;justify-content:space-between;align-items:center;
    padding:7px 10px;border-radius:8px;background:var(--card2);margin-bottom:6px;font-size:14px}
  .statrow .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:1px}
  .statrow b{font-family:Consolas,monospace}
  .statrow .lv{color:var(--tx3);font-size:12.5px;margin-left:8px}
  .kpi{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .kpi .k{flex:1 1 30%;background:var(--card2);border-radius:10px;padding:8px 12px;text-align:center}
  .kpi .k small{display:block;color:var(--tx3);font-size:11.5px}
  .kpi .k b{font-size:17px;font-family:Consolas,monospace}
  .why{margin-top:12px;color:var(--tx2);font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px 6px;margin-bottom:18px}
  .chart .cap{padding:2px 14px 8px;color:var(--tx2);font-size:13.5px}
  .chart .cap b{color:var(--tx)}
  #chartA,#chartB,#chartC,#chartCheap{width:100%;height:360px}
  .bpanel{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:4px 14px 16px}
  .bpanel .slider{flex:1 1 260px}
  .bpanel input[type=range]{width:100%;accent-color:var(--atk)}
  .bpanel .dval{font-family:Consolas,monospace;color:var(--warn);font-size:18px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--tx3);font-weight:600}
  td b{font-family:Consolas,monospace}
  .small{color:var(--tx3);font-size:12px}
  .params{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
  .pgrid label{display:block;color:var(--tx3);font-size:12px;margin-bottom:3px}
  .pgrid input,.pgrid select{width:100%;background:var(--card2);color:var(--tx);
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:Consolas,monospace;font-size:14px}
  .pgrid .grp{grid-column:span 4;color:var(--tx2);font-size:13px;margin-top:4px;border-bottom:1px dashed var(--line)}
  .btn{margin-top:14px;background:var(--atk);color:#1c1405;border:none;border-radius:9px;
    padding:10px 26px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .notes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 24px;font-size:14px;color:var(--tx2);margin-bottom:18px}
  .notes h4{color:var(--tx);margin:16px 0 6px;font-size:15px}
  .notes li{margin:4px 0}
  .notes a{color:#7fb7ff;text-decoration:none}
  .notes a:hover{text-decoration:underline}
  .notes code{background:var(--card2);border-radius:5px;padding:1px 6px;font-size:13px;color:var(--warn)}
  .tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:6px;
    padding:1px 8px;font-size:12px;color:var(--tx2);margin-right:6px}
  .foot{margin-top:26px;color:var(--tx3);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="headrow">
    <div><h1 id="t_title"></h1><p id="t_sub"></p></div>
    <div class="langbtns" id="langbtns"></div>
  </div>
  <div class="formula">
    <b id="t_formulaLabel"></b>&nbsp;&nbsp;<span class="f">M = (1 + ATK%) × (1 − DEF×(1 − Pierce%)) × (1 + CritRate% × CritDmg%)</span>
    <small id="t_formulaNote"></small>
  </div>
</header>

<h2 id="t_secVerdict"></h2>
<div class="cards" id="verdicts"></div>

<h2 id="t_secChartA"></h2>
<div class="chart">
  <div class="cap" id="capA"></div>
  <div id="chartA"></div>
</div>

<h2 id="t_secChartB"></h2>
<div class="chart">
  <div class="cap" id="capB"></div>
  <div id="chartB"></div>
  <div class="bpanel">
    <div class="slider">
      <span class="dval" id="dval">def = 32%</span>
      <input type="range" id="dslider" min="15" max="50" step="1" value="32">
    </div>
    <div style="flex:2 1 420px;min-width:300px" id="dsel"></div>
  </div>
</div>

<h2 id="t_secChartC"></h2>
<div class="chart">
  <div class="cap" id="capC"></div>
  <div id="chartC"></div>
</div>

<h2 id="t_secCheap"></h2>
<div class="chart">
  <div class="cap" id="capCheap"></div>
  <div id="chartCheap"></div>
</div>
<div class="notes" id="cheapTable"></div>

<h2 id="t_secParams"></h2>
<div class="params">
  <div class="pgrid" id="pgrid"></div>
  <button class="btn" id="apply"></button>
</div>

<h2 id="t_secNotes"></h2>
<div class="notes" id="notes"></div>

<div class="foot" id="t_foot"></div>
</div>

<script src="echarts.min.js"></script>

/* ================= 默认参数 ================= */
const DEFAULTS = {
  budget: 89, inc: 3,
  base: { pierce: 0, crit_rate: 15, crit_dmg: 35, atk: 0 },
  init: { pierce: 3,  crit_rate: 3,  crit_dmg: 6,  atk: 6 },
  caps: { pierce: 50, crit_rate: 100, crit_dmg: 200, atk: 1e9 },
  dmin: 15, dmax: 50, model: "linear",
};
let params = JSON.parse(JSON.stringify(DEFAULTS));

const STATS = [
  { key: "pierce",    color: "#4fc3f7" },
  { key: "crit_rate", color: "#ff8a80" },
  { key: "crit_dmg",  color: "#b388ff" },
  { key: "atk",       color: "#ffb74d" },
];
const statName = k => t("stat_" + k);
const statShort = k => t("statS_" + k);

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const avg = a => a.reduce((s, x) => s + x, 0) / a.length;

function startVal(k) { return params.base[k] + params.init[k]; }
function statVal(k, lv) { return Math.min(startVal(k) + params.inc * lv, params.caps[k]); }
function capLevels(k) {
  const c = params.caps[k], s = startVal(k);
  return c > s ? Math.ceil((c - s) / params.inc) : 0;
}
function fDef(P, D) {
  const eff = D * (1 - P / 100);
  return params.model === "linear" ? 1 - eff / 100 : 100 / (100 + eff);
}
function multOf(st, D) {
  return (1 + st.atk / 100) * fDef(st.pierce, D) * (1 + st.crit_rate * st.crit_dmg / 1e4);
}
function makeStats(lv) {
  return {
    pierce: statVal("pierce", lv.pierce), crit_rate: statVal("crit_rate", lv.crit_rate),
    crit_dmg: statVal("crit_dmg", lv.crit_dmg), atk: statVal("atk", lv.atk),
  };
}

/* ================= 求解(穷举,与 solve.py 一致) ================= */
function Dgrid() {
  const a = Math.round(Math.min(params.dmin, params.dmax));
  const b = Math.round(Math.max(params.dmin, params.dmax));
  const out = []; for (let D = a; D <= b; D++) out.push(D);
  return out.length ? out : [a];
}
function optimize(mode, fixedD, budget) {
  const B = budget == null ? params.budget : budget;
  const { inc } = params;
  const Ds = mode === "fixed" ? [fixedD] : Dgrid();
  const pmax = capLevels("pierce"), cmax = capLevels("crit_rate");
  let best = null, bestV = -1;
  for (let p = 0; p <= pmax; p++) {
    const P = statVal("pierce", p);
    const fs = Ds.map(D => fDef(P, D));
    const keyP = mode === "uniform" ? avg(fs) : (mode === "maximin" ? Math.min(...fs) : fs[0]);
    for (let q = 0; q <= cmax; q++) {
      const c = statVal("crit_rate", q);
      for (let s = 0; s <= B; s++) {
        const r = B - p - q - s;
        if (r < 0) break;
        const k = statVal("crit_dmg", r);
        const v = (1 + statVal("atk", s) / 100) * (1 + c * k / 1e4) * keyP;
        if (v > bestV) { bestV = v; best = { pierce: p, crit_rate: q, crit_dmg: r, atk: s }; }
      }
    }
  }
  return best;
}
function buildCurve(lv) {
  const st = makeStats(lv);
  const Ds = Dgrid();
  const M = Ds.map(D => multOf(st, D));
  return { lv, st, Ds, M, avgM: avg(M), minM: Math.min(...M) };
}
function topBuilds(n) {
  const { budget } = params, Ds = Dgrid();
  const rows = [];
  const pmax = capLevels("pierce"), cmax = capLevels("crit_rate");
  for (let p = 0; p <= pmax; p++) {
    const P = statVal("pierce", p);
    const fbar = avg(Ds.map(D => fDef(P, D)));
    for (let q = 0; q <= cmax; q++) {
      const c = statVal("crit_rate", q);
      for (let s = 0; s <= budget; s++) {
        const r = budget - p - q - s;
        if (r < 0) break;
        const k = statVal("crit_dmg", r), a = statVal("atk", s);
        rows.push({ v: (1 + a / 100) * (1 + c * k / 1e4) * fbar, p, q, r, s });
      }
    }
  }
  rows.sort((x, y) => y.v - x.v);
  const top = rows[0].v;
  return rows.filter(x => x.v >= top * 0.99).slice(0, n);
}
function marginalsAt(st, D) {
  const { inc } = params;
  const dP = st.pierce < params.caps.pierce ? Math.min(inc, params.caps.pierce - st.pierce) : 0;
  const dc = st.crit_rate < params.caps.crit_rate ? Math.min(inc, params.caps.crit_rate - st.crit_rate) : 0;
  const dk = st.crit_dmg < params.caps.crit_dmg ? Math.min(inc, params.caps.crit_dmg - st.crit_dmg) : 0;
  const crit = 1 + st.crit_rate * st.crit_dmg / 1e4;
  return {
    atk: 100 * inc / (100 + st.atk),
    crit_rate: dc ? 100 * (st.crit_dmg * dc / 1e4) / crit : null,
    crit_dmg: dk ? 100 * (st.crit_rate * dk / 1e4) / crit : null,
    pierce: dP ? 100 * (D * dP / 1e4) / fDef(st.pierce, D) : null,
  };
}
function pierceBreakeven(st) {
  const den = st.atk + 200 - st.pierce;

}
function budgetSweep() {
  let cross = null;

  for (let B = 0; B <= params.budget; B++) {

    if (cross === null && lv.crit_rate > 0) cross = B;
    Bs.push(String(B));
    opt.push(+buildCurve(lv).avgM.toFixed(4));
    aa.push(+buildCurve({ pierce: 0, crit_rate: 0, crit_dmg: 0, atk: B }).avgM.toFixed(4));
    const L = Math.floor(B / 4);
    eq.push(B % 4 === 0 ? +buildCurve({ pierce: L, crit_rate: L, crit_dmg: L, atk: L }).avgM.toFixed(4) : null);

}

      L, B, within: B <= params.budget,
      eq: buildCurve({ pierce: L, crit_rate: L, crit_dmg: L, atk: L }),
      opt: buildCurve(optimize("uniform", null, B)),
      aa: buildCurve({ pierce: 0, crit_rate: 0, crit_dmg: 0, atk: Math.min(B, params.budget) }),
    };
  });
}

  PFIELDS.forEach(f => {

    if (f.select) setPath(params, f.key, el.value);
    else { const v = parseFloat(el.value); if (isFinite(v)) setPath(params, f.key, v); }
  });
  params.caps.atk = Math.max(params.caps.atk, startVal("atk") + params.inc * params.budget + 10);
  params.dmin = clamp(Math.round(params.dmin), 0, 90);

}

/* ================= 主流程 ================= */
function recompute() {
  const u = buildCurve(optimize("uniform"));
  uniformBuild = u;
  const m = buildCurve(optimize("maximin"));
  const allatk = buildCurve({ pierce: 0, crit_rate: 0, crit_dmg: 0, atk: params.budget });
  allatkBuild = allatk;
  const kmax = Math.min(capLevels("crit_dmg"), params.budget - capLevels("crit_rate"));
  const allcrit = buildCurve({ pierce: 0, crit_rate: capLevels("crit_rate"), crit_dmg: Math.max(0, kmax),
    atk: Math.max(0, params.budget - capLevels("crit_rate") - kmax) });
  const initial = buildCurve({ pierce: 0, crit_rate: 0, crit_dmg: 0, atk: 0 });

  renderVerdicts(u, m, allatk, allcrit, initial);

  const env = u.Ds.map(D => multOf(makeStats(optimize("fixed", D)), D));
  drawChartA({ u, m, allatk, allcrit, initial }, env);

  const step = Math.max(1, Math.round((params.dmax - params.dmin) / 7));
  const perD = [];
  for (let D = Math.round(params.dmin); D <= Math.round(params.dmax); D += step) {
    const lv = optimize("fixed", D);
    perD.push({ D, lv, st: makeStats(lv), M: multOf(makeStats(lv), D) });
  }
  drawChartB(perD);

  const mid = Math.round((params.dmin + params.dmax) / 2);
  const marg = [Math.round(params.dmin), mid, Math.round(params.dmax)]
    .filter((v, i, a) => a.indexOf(v) === i)
    .map(D => ({ D, m: marginalsAt(u.st, D) }));
  drawChartC(marg);

  const sweep = budgetSweep();
  const presets = cheapPresets();
  drawChartCheap(sweep, presets);
  renderCheap(sweep, presets, u.avgM);

  const top5 = topBuilds(5);
  renderNotes(top5, pierceBreakeven(u.st), u);

  const slider = document.getElementById("dslider");
  slider.min = Math.round(params.dmin); slider.max = Math.round(params.dmax);
  slider.value = clamp(+slider.value, +slider.min, +slider.max);
  renderDSel(+slider.value);
}

document.getElementById("apply").addEventListener("click", () => { readParams(); recompute(); });
document.getElementById("dslider").addEventListener("input", e => renderDSel(+e.target.value));
window.addEventListener("resize", () => Object.values(charts).forEach(c => c.resize()));

renderStaticTexts();
renderParamPanel();
recompute();
</script>
